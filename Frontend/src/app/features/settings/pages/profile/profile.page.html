<section class="card content-enter p-5 sm:p-6" aria-labelledby="profile-heading">
  <div class="mb-5">
    <h2 id="profile-heading" class="text-base font-semibold text-text">Perfil</h2>
    <p class="mt-1 text-sm text-text-muted">Dados vinculados à sua sessão atual.</p>
  </div>

  @if (currentUser(); as user) {
    <dl class="grid gap-5 border-t border-border-subtle pt-5 sm:grid-cols-2">
      <div>
        <dt class="field-label">Nome</dt>
        <dd class="text-sm font-medium text-text">{{ user.nome }}</dd>
      </div>
      <div>
        <dt class="field-label">E-mail</dt>
        <dd class="break-all text-sm font-medium text-text">{{ user.email }}</dd>
      </div>
      <div>
        <dt class="field-label">Perfil de acesso</dt>
        <dd class="text-sm font-medium text-text">
          {{ user.role === 'ADMIN' ? 'Administrador' : 'Atendente' }}
        </dd>
      </div>
    </dl>
  } @else {
    <p class="border-t border-border-subtle pt-5 text-sm text-text-muted">
      Os dados do perfil não estão disponíveis nesta sessão.
    </p>
  }
</section>
