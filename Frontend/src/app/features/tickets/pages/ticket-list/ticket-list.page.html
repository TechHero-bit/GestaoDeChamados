<main class="mx-auto w-full max-w-[1440px] p-4 md:p-6">
  <div class="mb-6 flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center">
    <div>
      <h2 class="text-2xl font-bold tracking-tight text-on-surface md:text-[32px] md:leading-10">
        Fila de Atendimento
      </h2>
      <p class="mt-1 text-sm text-on-surface-variant">
        Gerencie e priorize os chamados recebidos pelo Outlook.
      </p>
    </div>
    <button
      type="button"
      class="primary-button"
      disabled
      title="Os e-mails são sincronizados automaticamente pelo Power Automate"
    >
      <span class="material-symbols-outlined text-xl" aria-hidden="true">sync</span>
      Sincronização automática
    </button>
  </div>

  <app-ticket-filters (filtersChanged)="onFiltersChanged($event)" />

  @if (error()) {
    <div
      class="mb-4 flex flex-col items-start justify-between gap-3 rounded-lg border border-error/30 bg-error-container p-4 text-on-error-container sm:flex-row sm:items-center"
      role="alert"
    >
      <div class="flex items-start gap-2">
        <span class="material-symbols-outlined" aria-hidden="true">error</span>
        <div>
          <p class="font-semibold">Não foi possível carregar os chamados</p>
          <p class="text-sm">{{ error() }}</p>
        </div>
      </div>
      <button
        type="button"
        class="secondary-button border-error/40 text-on-error-container"
        (click)="loadTickets()"
      >
        Tentar novamente
      </button>
    </div>
  }

  <section class="card overflow-hidden" aria-labelledby="tickets-table-title">
    <h3 id="tickets-table-title" class="sr-only">Chamados encontrados</h3>
    <app-ticket-table [tickets]="tickets()" [loading]="loading()" />

    <footer
      class="flex flex-col items-center justify-between gap-3 border-t border-outline-variant bg-surface-container-low/40 px-4 py-3 text-sm text-on-surface-variant sm:flex-row sm:px-6"
    >
      <p aria-live="polite">
        Mostrando
        <span class="font-semibold text-on-surface">{{ startIndex() }}–{{ endIndex() }}</span> de
        <span class="font-semibold text-on-surface">{{ total() }}</span>
      </p>
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="pagination-button"
          [disabled]="page() === 1 || loading()"
          aria-label="Página anterior"
          (click)="goToPage(page() - 1)"
        >
          <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
        </button>
        <span class="min-w-24 text-center">Página {{ page() }} de {{ totalPages() }}</span>
        <button
          type="button"
          class="pagination-button"
          [disabled]="page() === totalPages() || loading()"
          aria-label="Próxima página"
          (click)="goToPage(page() + 1)"
        >
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>
      </div>
    </footer>
  </section>
</main>
