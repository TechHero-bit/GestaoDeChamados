<section
  class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4"
  aria-label="Filtros de chamados"
>
  <div class="card p-4 md:col-span-2">
    <label for="ticket-search" class="field-label">Buscar chamados</label>
    <div class="relative">
      <span
        class="material-symbols-outlined pointer-events-none absolute left-0 top-2 text-xl text-outline"
        aria-hidden="true"
        >search</span
      >
      <input
        id="ticket-search"
        type="search"
        class="field-control pl-8"
        placeholder="Assunto, nome ou e-mail..."
        [(ngModel)]="search"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <div class="card p-4">
    <label for="ticket-status" class="field-label">Filtrar por status</label>
    <select id="ticket-status" class="field-control" [(ngModel)]="status" (change)="emitFilters()">
      <option value="">Todos os status</option>
      <option value="Aberto">Aberto</option>
      <option value="Em Andamento">Em Andamento</option>
      <option value="Resolvido">Resolvido</option>
    </select>
  </div>

  <div class="card p-4">
    <div class="flex items-center justify-between gap-2">
      <label for="ticket-date" class="field-label">Data de abertura</label>
      @if (search || status || date) {
        <button
          type="button"
          class="mb-2 text-xs font-semibold text-primary hover:underline"
          (click)="reset()"
        >
          Limpar
        </button>
      }
    </div>
    <input
      id="ticket-date"
      type="date"
      class="field-control"
      [(ngModel)]="date"
      (change)="emitFilters()"
    />
  </div>
</section>
