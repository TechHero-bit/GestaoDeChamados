<section
  class="mb-3 rounded-xl border border-border-subtle bg-surface-raised p-3"
  aria-label="Filtros de chamados"
>
  <div class="grid gap-2.5 md:grid-cols-[minmax(280px,1fr)_190px_170px_auto]">
    <div class="relative">
      <label for="ticket-search" class="sr-only">Buscar chamados</label>
      <span
        class="material-symbols-outlined pointer-events-none absolute left-3 top-2.5 text-xl text-text-muted"
        aria-hidden="true"
        >search</span
      >
      <input
        id="ticket-search"
        type="search"
        class="field-control pl-10"
        placeholder="Buscar por assunto, nome ou e-mail"
        [(ngModel)]="search"
        (input)="onSearchChange()"
      />
    </div>
    <div>
      <label for="ticket-status" class="sr-only">Filtrar por status</label>
      <select
        id="ticket-status"
        class="field-control"
        [(ngModel)]="status"
        (change)="emitFilters()"
      >
        <option value="">Todos os status</option>
        <option value="Aberto">Aberto</option>
        <option value="Em Andamento">Em andamento</option>
        <option value="Resolvido">Resolvido</option>
      </select>
    </div>
    <div>
      <label for="ticket-date" class="sr-only">Data de abertura</label>
      <input
        id="ticket-date"
        type="date"
        class="field-control"
        [(ngModel)]="date"
        (change)="emitFilters()"
      />
    </div>
    <button
      type="button"
      class="ghost-button justify-center"
      [disabled]="!search && !status && !date"
      (click)="reset()"
    >
      <span class="material-symbols-outlined text-lg" aria-hidden="true">filter_alt_off</span>Limpar
    </button>
  </div>
</section>
