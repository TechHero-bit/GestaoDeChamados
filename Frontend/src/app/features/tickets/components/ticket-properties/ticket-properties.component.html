<section class="side-section" aria-labelledby="properties-heading">
  <div class="mb-4 flex items-center justify-between">
    <h2 id="properties-heading" class="text-sm font-semibold text-text">Propriedades</h2>
    @if (saving()) {
      <span class="flex items-center gap-1.5 text-xs text-accent" role="status"
        ><span class="material-symbols-outlined animate-spin text-sm" aria-hidden="true"
          >progress_activity</span
        >Salvando</span
      >
    }
  </div>
  <div class="space-y-4">
    <div>
      <label for="detail-status" class="field-label">Status</label>
      <select
        id="detail-status"
        class="field-control"
        [ngModel]="selectedStatus"
        [disabled]="saving()"
        (ngModelChange)="onStatusChange($event)"
      >
        <option value="Aberto">Aberto</option>
        <option value="Em Andamento">Em andamento</option>
        <option value="Resolvido">Resolvido</option>
      </select>
    </div>
    <div>
      <label for="detail-priority" class="field-label">Prioridade</label>
      <select
        id="detail-priority"
        class="field-control"
        [ngModel]="selectedPriority"
        [disabled]="saving()"
        (ngModelChange)="onPriorityChange($event)"
      >
        <option value="Baixa">Baixa</option>
        <option value="Normal">Normal</option>
        <option value="Alta">Alta</option>
      </select>
    </div>
    @if (error()) {
      <p class="text-xs text-danger" role="alert">{{ error() }}</p>
    }
    <dl class="grid grid-cols-2 gap-x-3 gap-y-4 border-t border-border-subtle pt-4 text-xs">
      <div>
        <dt class="text-text-muted">Aberto em</dt>
        <dd class="mt-1 font-medium text-text-secondary">
          {{ formatDate(ticket().data_criacao) }}
        </dd>
      </div>
      <div>
        <dt class="text-text-muted">Atualizado em</dt>
        <dd class="mt-1 font-medium text-text-secondary">
          {{ formatDate(ticket().data_atualizacao) }}
        </dd>
      </div>
    </dl>
  </div>
</section>
