@switch (status()) {
  @case ('Aberto') {
    <span class="status-badge border-accent/25 bg-accent-soft text-accent">
      <span class="size-1.5 rounded-full bg-accent" aria-hidden="true"></span>Aberto
    </span>
  }
  @case ('Em Andamento') {
    <span class="status-badge border-warning/25 bg-warning-soft text-warning">
      <span class="size-1.5 rounded-full bg-warning" aria-hidden="true"></span>Em andamento
    </span>
  }
  @case ('Resolvido') {
    <span class="status-badge border-success/25 bg-success-soft text-success">
      <span class="size-1.5 rounded-full bg-success" aria-hidden="true"></span>Resolvido
    </span>
  }
}
