<header
  class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-border-subtle bg-surface/95 px-4 sm:px-6 lg:px-8"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="icon-button md:hidden"
      aria-label="Abrir menu"
      (click)="menuRequested.emit()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <div class="min-w-0">
      <p class="truncate text-sm font-semibold text-text">Central de atendimento</p>
      <p class="hidden text-xs text-text-muted sm:block">Operação em tempo real</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <div
      class="hidden items-center gap-2 rounded-full border border-border-subtle bg-surface px-3 py-1.5 text-xs text-text-secondary sm:flex"
    >
      <span class="size-1.5 rounded-full bg-success" aria-hidden="true"></span>
      Sistema operacional
    </div>
    @if (currentUser()) {
      <div class="hidden min-w-0 border-l border-border-subtle pl-4 text-right md:block">
        <p class="max-w-44 truncate text-sm font-semibold text-text">{{ currentUser()?.nome }}</p>
        <p class="text-xs text-text-muted">
          {{ currentUser()?.role === 'ADMIN' ? 'Administrador' : 'Atendente' }}
        </p>
      </div>
    }
    <div
      class="flex size-9 items-center justify-center rounded-lg border border-border bg-surface-elevated text-xs font-bold text-accent"
      [title]="currentUser()?.nome || 'Usuário autenticado'"
    >
      {{ userInitials() }}
    </div>
  </div>
</header>
