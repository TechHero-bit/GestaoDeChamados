<header
  class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-outline-variant bg-surface/95 px-4 shadow-sm backdrop-blur md:px-6"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="icon-button md:hidden"
      aria-label="Abrir menu"
      (click)="menuRequested.emit()"
    >
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <h1 class="text-lg font-semibold text-on-surface sm:text-2xl">Helpdesk Central</h1>
  </div>

  <div class="flex items-center gap-2">
    <button
      class="icon-button"
      type="button"
      disabled
      title="Notificações disponíveis em uma próxima fase"
      aria-label="Notificações indisponíveis"
    >
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
    </button>
    <button
      class="icon-button hidden sm:inline-flex"
      type="button"
      disabled
      title="Caixa de e-mail sincronizada via Outlook"
      aria-label="E-mail"
    >
      <span class="material-symbols-outlined" aria-hidden="true">mail</span>
    </button>

    @if (currentUser()) {
      <div class="hidden items-center gap-2 border-l border-outline-variant pl-3 sm:flex">
        <div class="flex flex-col text-right">
          <span class="text-xs font-semibold text-on-surface leading-tight">
            {{ currentUser()?.nome }}
          </span>
          <span class="text-[10px] font-bold uppercase tracking-wider text-outline">
            {{ currentUser()?.role === 'ADMIN' ? 'Administrador' : 'Atendente' }}
          </span>
        </div>
      </div>
    }

    <div
      class="flex size-9 items-center justify-center rounded-full border border-outline-variant bg-primary-fixed text-xs font-bold text-on-primary-fixed shadow-sm"
      [title]="currentUser()?.nome || 'Usuário autenticado'"
    >
      {{ userInitials() }}
    </div>

    <!-- Botão de Logout no Header -->
    <button
      type="button"
      class="icon-button text-on-surface-variant hover:text-error"
      (click)="onLogout()"
      title="Encerrar sessão (Logout)"
      aria-label="Encerrar sessão"
    >
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
    </button>
  </div>
</header>
